# The release pipeline. Trigger is RELEASE PUBLISHED, not tag push: tag-push
# events silently stopped firing on this repo on 2026-08-06 (probe-confirmed
# with a throwaway tag; workflow file and Actions settings unchanged), and
# release-published is the better trigger anyway -- the human act is writing
# the release notes, and everything downstream follows from it. PyPI trusts
# this exact repo + workflow filename + environment via OIDC (do not rename).
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z) to publish for"
        required: true

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - id: v
        name: Tag must equal the package version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          PKG="$(sed -n "s/^__version__ = '\(.*\)'/\1/p" src/ctrlkd/__init__.py)"
          echo "tag=$TAG package=$PKG"
          [ "v$PKG" = "$TAG" ] || { echo "::error::tag $TAG != package $PKG"; exit 1; }
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

  publish:
    needs: guard
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # OIDC for trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  tap:
    needs: [guard, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for PyPI to serve the new sdist
        id: sdist
        run: |
          V="${{ needs.guard.outputs.version }}"
          for i in $(seq 1 30); do
            OUT="$(curl -s https://pypi.org/pypi/ctrl-kd/$V/json | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
              f=[x for x in d['urls'] if x['packagetype']=='sdist'][0]
              print(f['url']); print(f['digests']['sha256'])
          except Exception:
              pass")"
            [ -n "$OUT" ] && break
            sleep 10
          done
          [ -n "$OUT" ] || { echo "::error::PyPI never served $V"; exit 1; }
          echo "url=$(echo "$OUT" | head -1)" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$OUT" | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Bump Formula/ctrl-kd.rb
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:jonmichaels/homebrew-tap tap
          cd tap
          URL="${{ steps.sdist.outputs.url }}"; SHA="${{ steps.sdist.outputs.sha }}"
          if grep -qF "$URL" Formula/ctrl-kd.rb; then
            echo "formula already at this version -- nothing to do"; exit 0
          fi
          sed -i "s|url \"https://files.pythonhosted.org/packages/[^\"]*\"|url \"$URL\"|" Formula/ctrl-kd.rb
          sed -i "0,/sha256 \"[0-9a-f]\{64\}\"/s//sha256 \"$SHA\"/" Formula/ctrl-kd.rb
          git config user.name "release-automation"
          git config user.email "release-automation@users.noreply.github.com"
          git commit -am "ctrl-kd ${{ needs.guard.outputs.version }} (automated)"
          git push origin main
